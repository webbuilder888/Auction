<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copart Auction Simulator 2026</title>
    <style>
        :root {
            --bg-dark: #080d16;
            --panel-bg: #111927;
            --panel-border: rgba(255, 255, 255, 0.08);
            --neon-blue: #00f0ff;
            --neon-green: #00ff66;
            --neon-red: #ff3366;
            --text-white: #ffffff;
            --text-gray: #9ca3af;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-white);
            font-family: 'Inter', system-ui, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        /* TOP NAVIGATION UTILITIES */
        .utility-bar {
            background: #111827;
            border-bottom: 1px solid var(--panel-border);
            padding: 12px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .utility-left {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .utility-right {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .balance-box {
            background: rgba(0, 255, 102, 0.1);
            border: 1px solid var(--neon-green);
            padding: 8px 18px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 18px;
            color: var(--neon-green);
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.15);
        }

        select, .promo-box input {
            background: #1f2937;
            color: white;
            border: 1px solid var(--panel-border);
            padding: 8px 12px;
            border-radius: 6px;
            outline: none;
            font-size: 14px;
        }

        .promo-box {
            display: flex;
            gap: 5px;
        }

        .btn-mini {
            background: var(--neon-blue);
            color: #000;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-garage-toggle {
            background: #374151;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        /* CORE CENTERED LAYOUT */
        .main-layout {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .panel {
            background: var(--panel-bg);
            border-radius: 20px;
            border: 1px solid var(--panel-border);
            padding: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .brand-title {
            text-align: center;
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 1px;
            margin-bottom: 20px;
            background: linear-gradient(90deg, var(--neon-blue), #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* IMAGE FEED */
        .stage-box {
            width: 100%;
            height: 420px;
            border-radius: 14px;
            overflow: hidden;
            background: #000;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stage-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* INFO & STATUS ROW */
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0;
        }

        .car-details h2 { margin: 0; font-size: 24px; font-weight: 800; }
        .condition-tag {
            display: inline-block;
            background: rgba(255, 51, 102, 0.12);
            border: 1px solid var(--neon-red);
            color: var(--neon-red);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            margin-top: 5px;
            text-transform: uppercase;
        }

        .status-box { text-align: right; }
        .timer-badge {
            background: var(--neon-red);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 900;
            font-size: 15px;
            box-shadow: 0 0 10px rgba(255, 51, 102, 0.3);
        }
        .price-badge {
            font-size: 32px;
            font-weight: 900;
            color: var(--neon-blue);
            margin-top: 5px;
        }

        /* STREAMING LOGS */
        .live-history {
            height: 110px;
            background: #090e15;
            border-radius: 10px;
            padding: 12px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 13px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.02);
        }

        .history-line { padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,0.01); }

        /* ACTIONS */
        .center-actions {
            display: flex;
            justify-content: center;
        }

        .btn-main {
            background: linear-gradient(90deg, var(--neon-blue), #00bcff);
            color: #000;
            border: none;
            padding: 16px 50px;
            font-size: 18px;
            font-weight: 800;
            border-radius: 12px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
            width: 100%;
            transition: transform 0.1s;
        }

        .btn-main:active { transform: scale(0.98); }

        /* MODAL GARAGE OVERLAY */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
        }

        .modal-garage {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            width: 90%;
            max-width: 550px;
            border-radius: 16px;
            padding: 25px;
        }

        .garage-list {
            max-height: 300px;
            overflow-y: auto;
            margin: 15px 0;
        }

        .garage-card {
            background: #1e293b;
            padding: 12px 18px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-sell {
            background: var(--neon-green);
            color: #000;
            border: none;
            padding: 6px 14px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="utility-bar">
        <div class="utility-left">
            <button class="btn-garage-toggle" id="nav-garage-btn" onclick="toggleGarage(true)">Гараж (0)</button>
            
            <div class="promo-box">
                <input type="text" id="promo-field" placeholder="Promo code...">
                <button class="btn-mini" onclick="claimVoucher()">OK</button>
            </div>
        </div>

        <div class="utility-right">
            <select id="lang-selector" onchange="changeLang()">
                <option value="ru">Русский</option>
                <option value="en">English</option>
            </select>
            <div class="balance-box">$<span id="wallet-ui">150</span></div>
        </div>
    </div>

    <div class="main-layout">
        <div class="panel">
            <div class="brand-title">COPART LIVE STAGE</div>

            <div class="stage-box">
                <img id="stage-img" src="" alt="Vehicle Feed">
            </div>

            <div class="info-row">
                <div class="car-details">
                    <h2 id="stage-title">Loading...</h2>
                    <div class="condition-tag" id="stage-condition">Wrecked / Insured</div>
                </div>
                <div class="status-box">
                    <span id="timer-display" class="timer-badge">4.0s</span>
                    <div id="price-display" class="price-badge">$0</div>
                </div>
            </div>

            <div class="live-history" id="logs-feed"></div>

            <div class="center-actions">
                <button class="btn-main" id="action-btn" onclick="submitBid()">Повысить ставку (+$10)</button>
            </div>
        </div>
    </div>

    <div class="overlay" id="garage-modal">
        <div class="modal-garage">
            <h2 style="margin-top:0;" id="modal-g-title">Мой Гараж</h2>
            <div class="garage-list" id="garage-box"></div>
            <button class="btn-mini" style="background:#ef4444; color:#fff; width:100%; padding:10px;" onclick="toggleGarage(false)">Закрыть</button>
        </div>
    </div>

    <script>
        const local = {
            ru: {
                bid: "Повысить ставку (+$10)",
                next: "Следующий Лот ➔",
                condition: "Поврежден / Сертификат Copart",
                won: "🎉 Лот выигран! Машина добавлена в ваш Гараж.",
                botWon: "забрал лот. Ваши замороженные средства возвращены.",
                noCash: "Недостаточно средств для совершения ставки!",
                promoOk: "Ваучер активирован успешно!",
                promoUsed: "Вы уже использовали этот промокод!",
                promoNo: "Такого кода не существует.",
                sell: "Продать лот"
            },
            en: {
                bid: "Place Bid (+$10)",
                next: "Next Lot ➔",
                condition: "Salvage / Copart Verified",
                won: "🎉 Lot Won! Vehicle transferred to your Garage.",
                botWon: "won the lot. Your locked bids have been refunded.",
                noCash: "Insufficient balance to place this bid!",
                promoOk: "Voucher applied successfully!",
                promoUsed: "You have already used this promo code!",
                promoNo: "This voucher does not exist.",
                sell: "Sell lot"
            }
        };

        let lang = 'ru';

        // 15-20 TA MOSHINA: BARCHA LINKLAR TO'G'IRLANDI (100% GARANTIYA)
        const inventory = [
            { name: "VAZ 2101 Jiguli (1976)", base: 30, max: 80, img: "https://images.unsplash.com/photo-1605559424843-9e4c228bf1c2?auto=format&fit=crop&q=80&w=600" },
            { name: "VAZ 2106 (1991)", base: 40, max: 95, img: "https://images.unsplash.com/photo-1541899481282-d53bffe3c35d?auto=format&fit=crop&q=80&w=600" },
            { name: "Daewoo Tico (1998)", base: 35, max: 90, img: "https://images.unsplash.com/photo-1568605117036-5fe5e7bab0b7?auto=format&fit=crop&q=80&w=600" },
            { name: "Daewoo Matiz (2005)", base: 50, max: 120, img: "https://images.unsplash.com/photo-1553440569-bcc63803a83d?auto=format&fit=crop&q=80&w=600" },
            { name: "Chevrolet Spark (2012)", base: 65, max: 150, img: "https://images.unsplash.com/photo-1549399542-7e3f8b79c341?auto=format&fit=crop&q=80&w=600" },
            { name: "Chevrolet Nexia 3 (2019)", base: 85, max: 200, img: "https://images.unsplash.com/photo-1511919884226-fd3cad34687c?auto=format&fit=crop&q=80&w=600" },
            { name: "Chevrolet Cobalt (2021)", base: 95, max: 230, img: "https://images.unsplash.com/photo-1580273916550-e323be2ae537?auto=format&fit=crop&q=80&w=600" },
            { name: "Chevrolet Lacetti (2018)", base: 90, max: 210, img: "https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&q=80&w=600" },
            { name: "Hyundai Elantra (2023)", base: 140, max: 320, img: "https://images.unsplash.com/photo-1617469767053-d3b503a0bced?auto=format&fit=crop&q=80&w=600" },
            { name: "Kia Optima K5 (2022)", base: 180, max: 410, img: "https://images.unsplash.com/photo-1616565493149-a032f1460337?auto=format&fit=crop&q=80&w=600" },
            { name: "Toyota Camry V70 (2021)", base: 220, max: 480, img: "https://images.unsplash.com/photo-1619767886558-efdc259cde1a?auto=format&fit=crop&q=80&w=600" },
            { name: "BYD Song Plus EV (2024)", base: 280, max: 620, img: "https://images.unsplash.com/photo-1563720223185-11003d516935?auto=format&fit=crop&q=80&w=600" },
            { name: "Kia Sportage (2025)", base: 380, max: 980, img: "https://images.unsplash.com/photo-1709033325615-5840d216f2c3?auto=format&fit=crop&q=80&w=600" },
            { name: "Kia Sportage Turbo (2026)", base: 410, max: 1150, img: "https://images.unsplash.com/photo-1709033325255-749e7b23cfda?auto=format&fit=crop&q=80&w=600" },
            { name: "BMW M5 Competition (2024)", base: 550, max: 1400, img: "https://images.unsplash.com/photo-1617531653332-bd46c24f2068?auto=format&fit=crop&q=80&w=600" },
            { name: "Mercedes-Benz G63 AMG (2025)", base: 800, max: 2100, img: "https://images.unsplash.com/photo-1520050206274-a1ae446cb3cc?auto=format&fit=crop&q=80&w=600" },
            { name: "Chevrolet Camaro SS (2023)", base: 310, max: 790, img: "https://images.unsplash.com/photo-1615887023516-9b6bcd559e87?auto=format&fit=crop&q=80&w=600" }
        ];

        const bots = ["AlphaDiler", "CopartSniper", "Surgut_Auto", "Export_Manager", "Fixer_Lower"];

        // STATE MANAGER
        let balance = parseFloat(localStorage.getItem('auc_money')) || 150;
        let garage = JSON.parse(localStorage.getItem('auc_vault')) || [];
        let usedPromos = JSON.parse(localStorage.getItem('auc_promos_used')) || [];

        let currentItem = null;
        let currentCost = 0;
        let finalBidder = "";
        let frozenBids = 0;
        let seconds = 4.0;

        let syncClock = null;
        let syncAi = null;
        let activeAuction = true;

        function runSystem() {
            syncUI();
            launchNewSession();
        }

        function syncUI() {
            document.getElementById('wallet-ui').innerText = Math.floor(balance);
            document.getElementById('nav-garage-btn').innerText = `${lang === 'ru' ? 'Гараж' : 'Garage'} (${garage.length})`;
            document.getElementById('stage-condition').innerText = local[lang].condition;
            
            if (activeAuction) {
                document.getElementById('action-btn').innerText = local[lang].bid;
            } else {
                document.getElementById('action-btn').innerText = local[lang].next;
            }

            // Render Garage
            const box = document.getElementById('garage-box');
            box.innerHTML = "";
            garage.forEach((car, index) => {
                const el = document.createElement('div');
                el.className = "garage-card";
                el.innerHTML = `
                    <div>
                        <b style="font-size:14px;">${car.name}</b><br>
                        <span style="color:var(--neon-green); font-size:12px;">Cost: $${car.buy} ➔ Sell: $${car.sell}</span>
                    </div>
                    <button class="btn-sell" onclick="sellItem(${index})">${local[lang].sell}</button>
                `;
                box.appendChild(el);
            });

            localStorage.setItem('auc_money', balance);
            localStorage.setItem('auc_vault', JSON.stringify(garage));
            localStorage.setItem('auc_promos_used', JSON.stringify(usedPromos));
        }

        function launchNewSession() {
            clearInterval(syncClock);
            clearTimeout(syncAi);

            currentItem = inventory[Math.floor(Math.random() * inventory.length)];
            currentCost = currentItem.base;
            finalBidder = "";
            frozenBids = 0;
            seconds = 4.0;
            activeAuction = true;

            document.getElementById('stage-img').src = currentItem.img;
            document.getElementById('stage-title').innerText = currentItem.name;
            document.getElementById('price-display').innerText = "$" + currentCost;
            document.getElementById('timer-display').innerText = seconds.toFixed(1) + "s";
            document.getElementById('timer-display').style.background = "var(--neon-red)";
            
            document.getElementById('logs-feed').innerHTML = `<div class="history-line" style="color:var(--neon-blue)">[SYSTEM]: Лот выставлен на торги. Стартовая цена: $${currentCost}</div>`;
            document.getElementById('action-btn').onclick = submitBid;
            
            syncUI();
            startCountdown();
            queueAiMove();
        }

        function startCountdown() {
            syncClock = setInterval(() => {
                seconds -= 0.1;
                if (seconds <= 0) {
                    seconds = 0;
                    clearInterval(syncClock);
                    closeSession();
                }
                document.getElementById('timer-display').innerText = seconds.toFixed(1) + "s";
            }, 100);
        }

        function submitBid() {
            if (!activeAuction) return;

            if (balance < 10) {
                alert(local[lang].noCash);
                return;
            }

            balance -= 10;
            frozenBids += 10;
            currentCost += 10;
            finalBidder = "Player";
            seconds = 4.0; // Reset timer

            pushLog("You", currentCost);
            document.getElementById('price-display').innerText = "$" + currentCost;
            syncUI();

            clearTimeout(syncAi);
            queueAiMove();
        }

        function queueAiMove() {
            if (!activeAuction) return;

            // O'RTACHA QIYINLIK ALGORITMI
            if (currentCost < currentItem.max) {
                // Moshina qimmatlashgani sari bot stavka qilish ehtimoli ortadi yoki kamayadi
                let botThreshold = 0.5; 
                if (Math.random() > botThreshold) {
                    let reaction = 700 + Math.random() * 1500; // 0.7s dan 2.2s gacha oraliqda bot o'ylaydi
                    syncAi = setTimeout(() => {
                        if (!activeAuction) return;

                        currentCost += 10;
                        let name = bots[Math.floor(Math.random() * bots.length)];
                        finalBidder = name;
                        seconds = 4.0; // Reset timer

                        pushLog(name, currentCost);
                        document.getElementById('price-display').innerText = "$" + currentCost;
                        
                        queueAiMove();
                    }, reaction);
                }
            }
        }

        function pushLog(user, price) {
            const feed = document.getElementById('logs-feed');
            let color = user === "You" ? "var(--neon-green)" : "var(--text-white)";
            feed.innerHTML += `<div class="history-line" style="color:${color}">➔ <b>${user}</b>: ставка <b>$${price}</b></div>`;
            feed.scrollTop = feed.scrollHeight;
        }

        function closeSession() {
            activeAuction = false;
            clearTimeout(syncAi);
            document.getElementById('timer-display').style.background = "#4b5563";

            if (finalBidder === "Player") {
                alert(local[lang].won);
                let profit = 25 + Math.floor(Math.random() * 16); 
                garage.push({
                    name: currentItem.name,
                    buy: currentCost,
                    sell: currentCost + profit
                });
            } else if (finalBidder === "") {
                alert("Lot closed with no bids.");
            } else {
                if (frozenBids > 0) {
                    balance += frozenBids;
                    alert(`${finalBidder} ${local[lang].botWon}`);
                } else {
                    alert(`${finalBidder} won this lot.`);
                }
            }

            document.getElementById('action-btn').innerText = local[lang].next;
            document.getElementById('action-btn').onclick = launchNewSession;
            syncUI();
        }

        function sellItem(index) {
            balance += garage[index].sell;
            garage.splice(index, 1);
            syncUI();
        }

        function toggleGarage(show) {
            document.getElementById('garage-modal').style.display = show ? 'flex' : 'none';
        }

        function claimVoucher() {
            const code = document.getElementById('promo-field').value.trim();
            
            if (code === "seevent2026" || code === "welecet200") {
                if (usedPromos.includes(code)) {
                    alert(local[lang].promoUsed);
                    return;
                }
                
                let bonus = code === "seevent2026" ? 500 : 800;
                balance += bonus;
                usedPromos.push(code);
                alert(local[lang].promoOk + ` (+$${bonus})`);
                document.getElementById('promo-field').value = "";
                syncUI();
            } else {
                alert(local[lang].promoNo);
            }
        }

        function changeLang() {
            lang = document.getElementById('lang-selector').value;
            syncUI();
        }

        window.onload = runSystem;
    </script>
</body>
</html>
