<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEXUS AUCTION — Cyberpunk Edition</title>
    <style>
        :root {
            --bg-dark: #020308;
            --panel-glass: rgba(6, 10, 26, 0.8);
            --panel-border: rgba(0, 240, 255, 0.3);
            --neon-blue: #00f0ff;
            --neon-green: #00ff66;
            --neon-red: #ff3366;
            --neon-purple: #bd59ff;
            --neon-diamond: #00e5ff;
            --text-white: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg-dark);
            color: var(--text-white);
            font-family: 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            -webkit-tap-highlight-color: transparent;
        }

        /* DYNAMIC MOVING CYBER GRID (Harakatlanuvchi jonli fon) */
        .cyber-grid {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: center top;
            z-index: 1;
            transform-origin: center top;
            animation: gridMove 12s infinite linear;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 0 40px; }
        }

        .bg-glows {
            position: absolute;
            width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 30%, rgba(189, 89, 255, 0.15) 0%, transparent 60%),
                        radial-gradient(circle at 10% 80%, rgba(0, 240, 255, 0.1) 0%, transparent 40%);
            z-index: 1;
            pointer-events: none;
        }

        /* TOP PREMIUM NAVIGATION HUB */
        .nexus-header {
            background: rgba(3, 5, 14, 0.9);
            border-bottom: 2px solid var(--neon-blue);
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 75px;
            backdrop-filter: blur(20px);
            box-shadow: 0 5px 25px rgba(0, 240, 255, 0.2);
            z-index: 10;
            position: relative;
        }

        .brand-title {
            font-size: 20px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 10px var(--neon-blue);
            color: #fff;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .asset-badge-cash {
            background: rgba(0, 255, 102, 0.1);
            border: 2px solid var(--neon-green);
            padding: 6px 14px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 15px;
            color: var(--neon-green);
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
        }

        .asset-badge-diamond {
            background: rgba(0, 229, 255, 0.1);
            border: 2px solid var(--neon-diamond);
            padding: 6px 14px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 15px;
            color: var(--neon-diamond);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
        }

        .promo-box { display: flex; gap: 6px; }
        .promo-box input {
            background: #090e22;
            color: white;
            border: 1px solid var(--panel-border);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            width: 90px;
            outline: none;
        }
        .btn-promo-ok {
            background: var(--neon-purple);
            color: white;
            border: none;
            padding: 8px 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 10px var(--neon-purple);
        }

        /* MAIN CENTERED STAGE LAYOUT */
        .nexus-workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 15px;
            gap: 15px;
            box-sizing: border-box;
            z-index: 5;
            position: relative;
            height: calc(100vh - 75px);
        }

        /* CENTER VIEWPORT SYSTEM (Moshina Turadigan Ulkan Markaz) */
        .center-showcase {
            flex: 1;
            background: var(--panel-glass);
            border: 1.5px solid var(--panel-border);
            border-radius: 24px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            overflow: hidden;
            box-shadow: inset 0 0 30px rgba(0, 240, 255, 0.1);
        }

        .mode-indicator {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #000;
            border: 1.5px solid var(--neon-blue);
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* BRAND NEW FULLSIZE STAGE CANVAS CONTAINER */
        .car-viewport-stage {
            width: 100%;
            height: 55%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        canvas {
            display: block;
            max-width: 100%;
            max-height: 100%;
        }

        /* SCI-FI HUD PANEL FOR DATA */
        .hud-metrics-panel {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            background: rgba(2, 4, 12, 0.8);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 15px 20px;
            border-radius: 16px;
            gap: 10px;
        }

        .car-info h2 { margin: 0; font-size: 22px; font-weight: 900; color: #fff; }
        .tier-tag {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            margin-top: 5px;
        }

        .live-price-zone { text-align: center; }
        .live-price-tag { font-size: 36px; font-weight: 900; font-family: monospace; text-shadow: 0 0 15px rgba(0, 255, 102, 0.4); }

        .time-zone { text-align: right; }
        .countdown-display { 
            background: var(--neon-red); 
            color: white; 
            padding: 6px 16px; 
            border-radius: 12px; 
            font-weight: 900; 
            font-size: 14px;
            box-shadow: 0 0 12px var(--neon-red);
        }

        /* LIVE LIVE FEED TELEMETRY */
        .terminal-log-box {
            height: 65px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 12px;
            padding: 8px 15px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            border: 1px solid rgba(255,255,255,0.03);
        }
        .feed-item { padding: 2px 0; }

        /* THE MASSIVE BOTTOM ACTION BUTTON */
        .btn-nexus-core-bid {
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple));
            color: white;
            border: none;
            padding: 20px;
            font-size: 20px;
            font-weight: 900;
            border-radius: 18px;
            cursor: pointer;
            text-transform: uppercase;
            width: 100%;
            box-shadow: 0 5px 25px rgba(189, 89, 255, 0.4);
            letter-spacing: 2px;
            transition: transform 0.05s;
        }
        .btn-nexus-core-bid:active { transform: scale(0.97); }

        /* BOTTOM HORIZONTAL GARAGE OVERVIEW (Gorizontal silliq garaj) */
        .bottom-garage-tray {
            background: var(--panel-glass);
            border: 1.5px solid var(--panel-border);
            border-radius: 20px;
            padding: 12px 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            height: 140px;
            box-sizing: border-box;
        }

        .garage-header-title {
            font-size: 13px;
            font-weight: 900;
            text-transform: uppercase;
            color: var(--neon-purple);
            letter-spacing: 1px;
        }

        .garage-vault-horizontal-scroll {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            white-space: nowrap;
            padding-bottom: 5px;
        }
        /* Scrollbarni chiroyli qilish */
        .garage-vault-horizontal-scroll::-webkit-scrollbar { height: 4px; }
        .garage-vault-horizontal-scroll::-webkit-scrollbar-thumb { background: var(--neon-blue); border-radius: 10px; }

        .garage-item-card {
            display: inline-flex;
            flex-direction: column;
            justify-content: space-between;
            background: rgba(14, 21, 46, 0.9);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 10px 14px;
            border-radius: 12px;
            min-width: 220px;
            box-sizing: border-box;
        }

        .btn-sell-asset {
            background: var(--neon-green);
            color: #000;
            border: none;
            padding: 4px 10px;
            font-weight: 900;
            font-size: 11px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 4px;
            width: 100%;
        }

        @media (max-width: 768px) {
            .hud-metrics-panel { grid-template-columns: 1fr; text-align: center; gap: 12px; }
            .time-zone { text-align: center; }
            .car-viewport-stage { height: 160px; }
            body { height: auto; overflow-y: auto; }
            .nexus-workspace { height: auto; }
        }
    </style>
</head>
<body>

    <div class="cyber-grid"></div>
    <div class="bg-glows"></div>

    <div class="nexus-header">
        <div class="brand-title">NEXUS PREMIUM</div>
        
        <div class="header-controls">
            <div class="promo-box">
                <input type="text" id="promo-field-node" placeholder="Promo...">
                <button class="btn-promo-ok" onclick="claimPromoToken()">OK</button>
            </div>
            <div class="asset-badge-diamond">💎 <span id="txt-diamonds">0</span></div>
            <div class="asset-badge-cash">💵 $<span id="txt-bankroll">150</span></div>
        </div>
    </div>

    <div class="nexus-workspace">
        
        <div class="center-showcase">
            <div class="mode-indicator" id="lbl-mode-state">Standart Mode</div>
            
            <div class="car-viewport-stage">
                <canvas id="carCanvas" width="460" height="220"></canvas>
            </div>

            <div class="hud-metrics-panel">
                <div class="car-info">
                    <h2 id="txt-car-name">Loading Live Asset...</h2>
                    <div class="tier-tag" id="lbl-tier-tag">Standart</div>
                </div>
                <div class="live-price-zone">
                    <div style="font-size: 11px; text-transform: uppercase; color: #7e8ea6; letter-spacing: 1px;">Текущая Ставка</div>
                    <div id="txt-price" class="live-price-tag" style="color: var(--neon-green);">$0</div>
                </div>
                <div class="time-zone">
                    <span id="txt-timer" class="countdown-display">4.0s</span>
                </div>
            </div>

            <div class="terminal-log-box" id="terminal-feed-logs"></div>

            <button class="btn-nexus-core-bid" id="btn-master-action" onclick="submitBidAction()">Повысить ставку (+$10)</button>
        </div>

        <div class="bottom-garage-tray">
            <div class="garage-header-title" id="lbl-garage-heading">Личный Гараж (0)</div>
            <div class="garage-vault-horizontal-scroll" id="garage-vault-container">
                </div>
        </div>

    </div>

    <script>
        const premiumRegistry = [
            { name: "Pagani Utopia Roadster (2026)", base: 34000, max: 95000, margin: 1000, color: "#cbd5e1", type: "sport" },
            { name: "Ferrari SF90 Stradale (2024)", base: 120000, max: 390000, margin: 1500, color: "#ff2a2a", type: "sport" },
            { name: "Lamborghini Revuelto (2025)", base: 250000, max: 620000, margin: 2000, color: "#ff9f00", type: "sport" },
            { name: "McLaren P1 Carbon Edition", base: 450000, max: 980000, margin: 2500, color: "#0070f3", type: "sport" },
            { name: "Porsche 918 Spyder Hybrid", base: 600000, max: 1300000, margin: 3000, color: "#10b981", type: "sport" },
            { name: "Koenigsegg Jesko Absolut", base: 950000, max: 2400000, margin: 4000, color: "#6366f1", type: "sport" },
            { name: "Bugatti Chiron Super Sport", base: 1500000, max: 3800000, margin: 4500, color: "#ff007f", type: "sport" },
            { name: "Bugatti Tourbillon V16 (2026)", base: 2100000, max: 4600000, margin: 5000, color: "#00f0ff", type: "sport" },
            { name: "Pagani Huayra Codalunga", base: 2800000, max: 5100000, margin: 5000, color: "#14b8a6", type: "sport" },
            { name: "Lamborghini Veneno Roadster", base: 3200000, max: 5400000, margin: 5000, color: "#f43f5e", type: "sport" },
            { name: "Bugatti La Voiture Noire", base: 4000000, max: 5800000, margin: 5000, color: "#1e293b", type: "sport" },
            { name: "Rolls-Royce Droptail Amethyst", base: 4500000, max: 6000000, margin: 5000, color: "#a855f7", type: "sedan" }
        ];

        const standartRegistry = [
            { name: "Chevrolet Spark (2012)", base: 65, max: 155, margin: 30, color: "#06b6d4", type: "sedan" },
            { name: "Chevrolet Cobalt (2021)", base: 95, max: 220, margin: 45, color: "#4f46e5", type: "sedan" },
            { name: "Hyundai Elantra (2023)", base: 145, max: 310, margin: 60, color: "#ec4899", type: "sedan" },
            { name: "Kia Optima K5 (2022)", base: 185, max: 395, margin: 80, color: "#f43f5e", type: "sedan" },
            { name: "Toyota Camry V70 (2021)", base: 230, max: 460, margin: 110, color: "#0f766e", type: "sedan" },
            { name: "BYD Song Plus EV (2024)", base: 290, max: 590, margin: 150, color: "#10b981", type: "suv" },
            { name: "Kia Sportage Turbo (2025)", base: 450, max: 1150, margin: 250, color: "#f59e0b", type: "suv" },
            { name: "Kia Sportage GT-Line (2026)", base: 520, max: 1390, margin: 300, color: "#ef4444", type: "suv" }
        ];

        const virtualOpponents = ["Alpha_Broker", "Cyber_Whale", "Dubai_Diler", "Crypto_King", "Nexus_Sniper"];

        let cashBalance = parseFloat(localStorage.getItem('nx_cash_v2')) || 150;
        let diamondBalance = parseInt(localStorage.getItem('nx_diamonds_v2')) || 0;
        let uniqueClaimedPromos = JSON.parse(localStorage.getItem('nx_promos_v2')) || [];
        let userVault = JSON.parse(localStorage.getItem('nx_vault_v2')) || [];

        let currentAsset = null;
        let realTimePrice = 0;
        let auctionLeader = "";
        let playerBidInvested = 0;
        let dynamicTimer = 4.0;

        let threadClock = null;
        let threadAi = null;
        let isAuctionSessionLive = true;
        let isPremiumUnlockedMode = false;

        function initNexusSystem() {
            evaluatePremiumState();
            syncVisualInterface();
            launchNewAuctionSession();
        }

        function evaluatePremiumState() {
            isPremiumUnlockedMode = (diamondBalance >= 200);
        }

        // ADVANCED 3D-STAGE VECHICLE GRAPHICS CONTROLLER (Yangi avlod neon chizgich)
        function drawVectorCar(color, type) {
            const canvas = document.getElementById('carCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 3D NEON PLATFORM PODIUM (Ostidagi Aylana Podium)
            ctx.shadowBlur = 20;
            ctx.shadowColor = color;
            ctx.strokeStyle = color;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.ellipse(230, 155, 170, 18, 0, 0, Math.PI * 2);
            ctx.stroke();

            // PODIUM GRID LINES (Platforma chiziqlari)
            ctx.lineWidth = 1;
            ctx.strokeStyle = "rgba(255,255,255,0.1)";
            for(let i=70; i<400; i+=30){
                ctx.beginPath(); ctx.moveTo(i, 155); ctx.lineTo(i + (i-230)/2, 173); ctx.stroke();
            }

            // CAR UNDERGLOW NEON (Moshina ostidagi neon)
            ctx.shadowBlur = 35;
            ctx.shadowColor = color;
            ctx.fillStyle = color;
            ctx.fillRect(110, 145, 230, 8);

            // MAIN CAR STRUCTURE
            ctx.shadowBlur = 20;
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 3;

            ctx.beginPath();
            if (type === "sport") {
                ctx.moveTo(70, 130);
                ctx.lineTo(105, 100); 
                ctx.lineTo(180, 82); 
                ctx.lineTo(275, 82); 
                ctx.lineTo(335, 104); 
                ctx.lineTo(390, 118); 
                ctx.lineTo(400, 130);
                ctx.lineTo(390, 142);
                ctx.lineTo(65, 142);
                // Rear Wing (Spoiler)
                ctx.moveTo(68, 125); ctx.lineTo(58, 105); ctx.lineTo(82, 105);
            } else if (type === "suv") {
                ctx.moveTo(65, 138);
                ctx.lineTo(68, 88);
                ctx.lineTo(140, 70);
                ctx.lineTo(270, 70);
                ctx.lineTo(325, 96);
                ctx.lineTo(390, 102);
                ctx.lineTo(395, 138);
                ctx.lineTo(65, 138);
            } else {
                ctx.moveTo(65, 134);
                ctx.lineTo(90, 102);
                ctx.lineTo(155, 82);
                ctx.lineTo(285, 82);
                ctx.lineTo(335, 108);
                ctx.lineTo(390, 114);
                ctx.lineTo(390, 134);
                ctx.lineTo(65, 134);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // WINDSHIELD GLASSMORPHISM
            ctx.shadowBlur = 0;
            ctx.fillStyle = "#030614";
            ctx.strokeStyle = color;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            if (type === "sport") {
                ctx.moveTo(155, 88); ctx.lineTo(245, 88); ctx.lineTo(275, 106); ctx.lineTo(135, 106);
            } else if (type === "suv") {
                ctx.moveTo(135, 78); ctx.lineTo(265, 78); ctx.lineTo(290, 102); ctx.lineTo(120, 102);
            } else {
                ctx.moveTo(145, 88); ctx.lineTo(270, 88); ctx.lineTo(295, 108); ctx.lineTo(130, 108);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // MATRIX RIMS AND TIRES (G'ildirak va neon disklar)
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#ffffff";
            ctx.fillStyle = "#040713";
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 4.5;

            // Front
            ctx.beginPath(); ctx.arc(135, 140, 26, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.strokeStyle = color; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(135, 140, 14, 0, Math.PI * 2); ctx.stroke();

            // Rear
            ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 4.5;
            ctx.beginPath(); ctx.arc(315, 140, 26, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.strokeStyle = color; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(315, 140, 14, 0, Math.PI * 2); ctx.stroke();
            
            // X-LASER OPTICS (Farlar)
            ctx.shadowBlur = 20;
            ctx.shadowColor = varColor('--neon-blue');
            ctx.strokeStyle = varColor('--neon-blue');
            ctx.lineWidth = 4;
            ctx.beginPath();
            if (type === "sport") {
                ctx.moveTo(375, 118); ctx.lineTo(393, 122);
            } else {
                ctx.moveTo(370, 112); ctx.lineTo(388, 116);
            }
            ctx.stroke();
        }

        function varColor(name) {
            return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
        }

        function syncVisualInterface() {
            document.getElementById('txt-bankroll').innerText = Math.floor(cashBalance).toLocaleString();
            document.getElementById('txt-diamonds').innerText = diamondBalance.toLocaleString();
            document.getElementById('lbl-garage-heading').innerText = `Личный Гараж (${userVault.length})`;

            const modeLbl = document.getElementById('lbl-mode-state');
            const tierTag = document.getElementById('lbl-tier-tag');
            
            if (isPremiumUnlockedMode) {
                modeLbl.innerText = "⭐ Premium Mode Active";
                modeLbl.style.color = "var(--neon-purple)";
                modeLbl.style.borderColor = "var(--neon-purple)";
                tierTag.innerText = "Hypercar / Tier S";
                tierTag.style.color = "var(--neon-purple)";
                tierTag.style.background = "rgba(189, 89, 255, 0.2)";
            } else {
                modeLbl.innerText = "⛓️ Standart Mode (Need 200 💎)";
                modeLbl.style.color = "var(--neon-blue)";
                modeLbl.style.borderColor = "var(--neon-blue)";
                tierTag.innerText = "Standart Asset";
                tierTag.style.color = "var(--neon-blue)";
                tierTag.style.background = "rgba(0, 240, 255, 0.1)";
            }

            if (isAuctionSessionLive) {
                document.getElementById('btn-master-action').innerText = isPremiumUnlockedMode ? "Повысить ставку (+$1000)" : "Повысить ставку (+$10)";
            } else {
                document.getElementById('btn-master-action').innerText = "Следующий Лот ➔";
            }

            const container = document.getElementById('garage-vault-container');
            container.innerHTML = "";
            userVault.forEach((item, index) => {
                const node = document.createElement('div');
                node.className = "garage-item-card";
                node.innerHTML = `
                    <div>
                        <div style="font-weight:900; font-size:13px; color:#fff;">${item.name}</div>
                        <div style="color:var(--neon-green); font-size:11px; margin-top:2px;">Цена: $${item.buy.toLocaleString()}</div>
                    </div>
                    <div>
                        <div style="color:#7e8ea6; font-size:10px;">Выкуп: +$${item.sell.toLocaleString()}</div>
                        <button class="btn-sell-asset" onclick="liquidateAsset(${index})">Продать</button>
                    </div>
                `;
                container.appendChild(node);
            });

            localStorage.setItem('nx_cash_v2', cashBalance);
            localStorage.setItem('nx_diamonds_v2', diamondBalance);
            localStorage.setItem('nx_promos_v2', JSON.stringify(uniqueClaimedPromos));
            localStorage.setItem('nx_vault_v2', JSON.stringify(userVault));
        }

        function launchNewAuctionSession() {
            clearInterval(threadClock);
            clearTimeout(threadAi);

            evaluatePremiumState();

            const activeRegistry = isPremiumUnlockedMode ? premiumRegistry : standartRegistry;
            currentAsset = activeRegistry[Math.floor(Math.random() * activeRegistry.length)];
            
            realTimePrice = currentAsset.base;
            auctionLeader = "";
            playerBidInvested = 0;
            dynamicTimer = 4.0;
            isAuctionSessionLive = true;

            drawVectorCar(currentAsset.color, currentAsset.type);

            document.getElementById('txt-car-name').innerText = currentAsset.name;
            document.getElementById('txt-price').innerText = "$" + realTimePrice.toLocaleString();
            document.getElementById('txt-timer').innerText = dynamicTimer.toFixed(1) + "s";
            
            document.getElementById('terminal-feed-logs').innerHTML = `<div class="feed-item" style="color:var(--neon-blue)">[SYSTEM]: Новый лот выставлен. Начальная ставка: $${realTimePrice.toLocaleString()}</div>`;
            document.getElementById('btn-master-action').onclick = submitBidAction;

            syncVisualInterface();
            startTimerCountdown();
            scheduleVirtualAiResponse();
        }

        function startTimerCountdown() {
            threadClock = setInterval(() => {
                dynamicTimer -= 0.1;
                if (dynamicTimer <= 0) {
                    dynamicTimer = 0;
                    clearInterval(threadClock);
                    finalizeAuctionSession();
                }
                document.getElementById('txt-timer').innerText = dynamicTimer.toFixed(1) + "s";
            }, 100);
        }

        function submitBidAction() {
            if (!isAuctionSessionLive) return;

            let bidStep = isPremiumUnlockedMode ? 1000 : 10;

            if (cashBalance < bidStep) {
                alert("Недостаточно средств!");
                return;
            }

            cashBalance -= bidStep;
            playerBidInvested += bidStep;
            realTimePrice += bidStep;
            auctionLeader = "Player";
            dynamicTimer = 4.0;

            pushTerminalLog("You", realTimePrice);
            document.getElementById('txt-price').innerText = "$" + realTimePrice.toLocaleString();
            syncVisualInterface();

            clearTimeout(threadAi);
            scheduleVirtualAiResponse();
        }

        function scheduleVirtualAiResponse() {
            if (!isAuctionSessionLive) return;

            if (realTimePrice < currentAsset.max) {
                if (Math.random() > 0.4) {
                    let adaptiveSpeed = isPremiumUnlockedMode ? (400 + Math.random() * 800) : (700 + Math.random() * 1200);
                    threadAi = setTimeout(() => {
                        if (!isAuctionSessionLive) return;

                        let bidStep = isPremiumUnlockedMode ? 1000 : 10;
                        realTimePrice += bidStep;
                        
                        let bot = virtualOpponents[Math.floor(Math.random() * virtualOpponents.length)];
                        auctionLeader = bot;
                        dynamicTimer = 4.0;

                        pushTerminalLog(bot, realTimePrice);
                        document.getElementById('txt-price').innerText = "$" + realTimePrice.toLocaleString();

                        scheduleVirtualAiResponse();
                    }, adaptiveSpeed);
                }
            }
        }

        function pushTerminalLog(user, price) {
            const container = document.getElementById('terminal-feed-logs');
            let color = user === "You" ? "var(--neon-green)" : "#fff";
            container.innerHTML += `<div class="feed-item" style="color:${color}">➔ <b>${user}</b>: $${price.toLocaleString()}</div>`;
            container.scrollTop = container.scrollHeight;
        }

        function finalizeAuctionSession() {
            isAuctionSessionLive = false;
            clearTimeout(threadAi);

            if (auctionLeader === "Player") {
                alert("🎉 Вы выиграли аукцион! Машина добавлена в Гараж.");
                userVault.push({
                    name: currentAsset.name,
                    buy: realTimePrice,
                    sell: realTimePrice + currentAsset.margin
                });
            } else if (auctionLeader === "") {
                alert("Время истекло.");
            } else {
                if (playerBidInvested > 0) {
                    cashBalance += playerBidInvested;
                    alert(`${auctionLeader} выиграл. Ваши ставки возвращены.`);
                } else {
                    alert(`${auctionLeader} забрал лот.`);
                }
            }

            document.getElementById('btn-master-action').innerText = "Следующий Лот ➔";
            document.getElementById('btn-master-action').onclick = launchNewAuctionSession;
            syncVisualInterface();
        }

        function liquidateAsset(index) {
            cashBalance += userVault[index].sell;
            userVault.splice(index, 1);
            syncVisualInterface();
        }

        function claimPromoToken() {
            const inputField = document.getElementById('promo-field-node').value.trim();
            
            if (inputField === "kievka") {
                if (uniqueClaimedPromos.includes(inputField)) {
                    alert("Вы уже использовали этот код!");
                    return;
                }
                cashBalance += 999999;
                diamondBalance += 999999;
                uniqueClaimedPromos.push(inputField);
                alert("👑 Секретный код создателя применен! +$999,999 и +999,999 💎");
                document.getElementById('promo-field-node').value = "";
                evaluatePremiumState();
                syncVisualInterface();
            }
            else if (inputField === "brilliantv03") {
                if (uniqueClaimedPromos.includes(inputField)) {
                    alert("Уже использовано!");
                    return;
                }
                diamondBalance += 20;
                uniqueClaimedPromos.push(inputField);
                alert("💎 +20 Бриллиантов.");
                document.getElementById('promo-field-node').value = "";
                evaluatePremiumState();
                syncVisualInterface();
            } else if (inputField === "seevent2026" || inputField === "welecet200") {
                if (uniqueClaimedPromos.includes(inputField)) {
                    alert("Уже использовано!");
                    return;
                }
                let bonus = inputField === "seevent2026" ? 500 : 800;
                cashBalance += bonus;
                uniqueClaimedPromos.push(inputField);
                alert(`💵 +$${bonus}`);
                document.getElementById('promo-field-node').value = "";
                syncVisualInterface();
            } else {
                alert("Неверный код.");
            }
        }

        window.onload = initNexusSystem;
    </script>
</body>
</html>
