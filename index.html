<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copart Fullscreen Hub 2026</title>
    <style>
        :root {
            --bg-dark: #090d16;
            --panel-bg: #121824;
            --panel-border: rgba(255, 255, 255, 0.08);
            --neon-blue: #00f0ff;
            --neon-green: #00ff66;
            --neon-red: #ff3366;
            --text-white: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-white);
            font-family: 'Inter', system-ui, sans-serif;
            height: 100vh;
            overflow: hidden; /* Skrol butunlay o'chirildi, hammasi 1 ekranda */
            display: flex;
            flex-direction: column;
        }

        /* INTEGRATED INTERFACE HEADER */
        .top-dash {
            background: var(--panel-bg);
            border-bottom: 1px solid var(--panel-border);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 50px;
            box-sizing: border-box;
        }

        .brand {
            font-size: 20px;
            font-weight: 900;
            background: linear-gradient(90deg, var(--neon-blue), #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .dash-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .balance-card {
            background: rgba(0, 255, 102, 0.12);
            border: 1px solid var(--neon-green);
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: 800;
            font-size: 16px;
            color: var(--neon-green);
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.1);
        }

        select, .promo-wrapper input {
            background: #1f2937;
            color: white;
            border: 1px solid var(--panel-border);
            padding: 6px 10px;
            border-radius: 5px;
            font-size: 13px;
            outline: none;
        }

        .promo-wrapper { display: flex; gap: 4px; }
        .btn-ok { background: var(--neon-blue); color: #000; border: none; padding: 6px 10px; font-weight: bold; border-radius: 5px; cursor: pointer; }

        /* MAIN TWO-COLUMN FULLSCREEN GRID */
        .workspace {
            flex: 1;
            display: grid;
            grid-template-columns: 2.8fr 1.2fr;
            gap: 15px;
            padding: 15px;
            box-sizing: border-box;
            height: calc(100vh - 50px);
        }

        .main-stage {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .sidebar-garage {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }

        /* GUARANTEED VECTOR IMAGE SYSTEM */
        .car-viewport {
            width: 100%;
            height: 50%;
            background: #05080f;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.03);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .car-viewport svg {
            width: 75%;
            height: 75%;
            filter: drop-shadow(0 0 15px rgba(0, 240, 255, 0.4));
        }

        /* DATA INFO BAR */
        .data-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 0;
        }

        .title-meta h2 { margin: 0; font-size: 22px; font-weight: 800; }
        .tag-cond {
            display: inline-block;
            background: rgba(255, 51, 102, 0.1);
            border: 1px solid var(--neon-red);
            color: var(--neon-red);
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            margin-top: 4px;
        }

        .bid-status { text-align: right; }
        .timer-badge { background: var(--neon-red); color: white; padding: 4px 12px; border-radius: 12px; font-weight: 900; font-size: 14px; }
        .live-price { font-size: 28px; font-weight: 900; color: var(--neon-blue); margin-top: 2px; }

        /* LIVE FEED TERMINAL */
        .terminal-feed {
            height: 75px;
            background: #06090e;
            border-radius: 8px;
            padding: 8px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            border: 1px solid rgba(255,255,255,0.02);
        }
        .feed-line { padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,0.01); }

        /* ACTION ZONE (CENTER/BOTTOM) */
        .btn-action-hub {
            background: linear-gradient(90deg, var(--neon-blue), #00bcff);
            color: #000;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 900;
            border-radius: 10px;
            cursor: pointer;
            text-transform: uppercase;
            width: 100%;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }

        /* GARAGE PANEL */
        .garage-header {
            font-size: 16px;
            font-weight: 800;
            text-transform: uppercase;
            border-left: 3px solid var(--neon-green);
            padding-left: 8px;
            margin-bottom: 10px;
        }

        .garage-scroller {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .garage-card {
            background: #192231;
            border: 1px solid rgba(255,255,255,0.03);
            padding: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-sell {
            background: var(--neon-green);
            color: #000;
            border: none;
            padding: 5px 10px;
            font-weight: 700;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="top-dash">
        <div class="brand">COPART ONE-SCREEN</div>
        
        <div class="dash-controls">
            <div class="promo-wrapper">
                <input type="text" id="promo-input" placeholder="Promo code...">
                <button class="btn-ok" onclick="applyPromoCode()">OK</button>
            </div>
            <select id="lang-menu" onchange="switchLang()">
                <option value="ru">Русский</option>
                <option value="en">English</option>
            </select>
            <div class="balance-card">💵 $<span id="wallet-balance">150</span></div>
        </div>
    </div>

    <div class="workspace">
        
        <div class="main-stage">
            <div class="car-viewport" id="vector-viewport">
                </div>

            <div class="data-row">
                <div class="title-meta">
                    <h2 id="car-title">Loading Vehicle...</h2>
                    <div class="tag-cond" id="lbl-status">Wrecked / Copart Sec</div>
                </div>
                <div class="bid-status">
                    <span id="timer-badge" class="timer-badge">4.0s</span>
                    <div id="price-badge" class="live-price">$0</div>
                </div>
            </div>

            <div class="terminal-feed" id="terminal-box"></div>

            <button class="btn-action-hub" id="main-action-btn" onclick="triggerBid()">Повысить ставку (+$10)</button>
        </div>

        <div class="sidebar-garage">
            <div class="garage-header" id="lbl-garage-header">Мой Гараж (0)</div>
            <div class="garage-scroller" id="garage-container">
                </div>
        </div>

    </div>

    <script>
        const dict = {
            ru: {
                bid: "Повысить ставку (+$10)",
                next: "Следующий Лот ➔",
                cond: "Поврежден / Сертификат Copart",
                won: "🎉 Лот выигран! Машина отправлена в ваш Гараж.",
                botWon: "забрал лот. Ваши заблокированные средства возвращены.",
                noMoney: "Недостаточно средств для ставки!",
                promoOk: "Промокод успешно применен!",
                promoUsed: "Вы уже использовали этот код!",
                promoWrong: "Неверный код.",
                sell: "Продать",
                gar: "Мой Гараж"
            },
            en: {
                bid: "Place Bid (+$10)",
                next: "Next Lot ➔",
                cond: "Salvage / Copart Verified",
                won: "🎉 Lot Won! Vehicle sent to your Garage.",
                botWon: "won the lot. Your locked funds have been refunded.",
                noMoney: "Insufficient funds to place a bid!",
                promoOk: "Promo code applied successfully!",
                promoUsed: "You have already used this code!",
                promoWrong: "Invalid code.",
                sell: "Sell",
                gar: "My Garage"
            }
        };

        let currentLang = 'ru';

        // 100% KAFOLATLANGAN SVG VEKTORLAR BAZASI (PIVO CHIQIB KETMAYDI!)
        const sedanSvg = `<svg viewBox="0 0 100 50" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M10 35H90V42H10V35Z" fill="#ff3366"/><path d="M15 35L25 22H65L80 35H15Z" fill="var(--neon-blue)" opacity="0.8"/><circle cx="28" cy="42" r="6" fill="#fff"/><circle cx="72" cy="42" r="6" fill="#fff"/></svg>`;
        const suvSvg = `<svg viewBox="0 0 100 50" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M10 32H90V42H10V32Z" fill="#a855f7"/><path d="M15 32L30 15H75L85 32H15Z" fill="var(--neon-blue)"/><circle cx="30" cy="42" r="7" fill="#fff"/><circle cx="70" cy="42" r="7" fill="#fff"/></svg>`;
        const sportSvg = `<svg viewBox="0 0 100 50" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 38H95V44H5V38Z" fill="#f1c40f"/><path d="M20 38L35 25H70L90 38H20Z" fill="var(--neon-green)" opacity="0.9"/><circle cx="26" cy="44" r="5" fill="#fff"/><circle cx="74" cy="44" r="5" fill="#fff"/></svg>`;

        // 15 TA MOSHINA HAR XIL NARXLARDA (SPORTAGE 2026 ENG QIMMATLARI QATORIDA)
        const carRegistry = [
            { name: "VAZ 2101 Jiguli (1976)", base: 30, max: 80, svg: sedanSvg },
            { name: "VAZ 2106 (1991)", base: 40, max: 95, svg: sedanSvg },
            { name: "Daewoo Tico (1998)", base: 35, max: 90, svg: sedanSvg },
            { name: "Daewoo Matiz (2005)", base: 50, max: 120, svg: sedanSvg },
            { name: "Chevrolet Spark (2012)", base: 65, max: 150, svg: sedanSvg },
            { name: "Chevrolet Nexia 3 (2019)", base: 85, max: 200, svg: sedanSvg },
            { name: "Chevrolet Cobalt (2021)", base: 95, max: 230, svg: sedanSvg },
            { name: "Chevrolet Lacetti (2018)", base: 90, max: 210, svg: sedanSvg },
            { name: "Hyundai Elantra (2023)", base: 140, max: 320, svg: sedanSvg },
            { name: "Kia Optima K5 (2022)", base: 180, max: 410, svg: sedanSvg },
            { name: "Toyota Camry V70 (2021)", base: 220, max: 480, svg: sedanSvg },
            { name: "BYD Song Plus EV (2024)", base: 280, max: 620, svg: suvSvg },
            { name: "Kia Sportage Turbo (2025)", base: 450, max: 1100, svg: suvSvg },
            { name: "Kia Sportage GT-Line (2026)", base: 500, max: 1350, svg: suvSvg }, // JUDA QIMMAT VA KURASH QATTIQ
            { name: "BMW M5 Competition (2024)", base: 600, max: 1500, svg: sportSvg },
            { name: "Mercedes-Benz G63 AMG (2025)", base: 800, max: 2200, svg: suvSvg }
        ];

        const aiBidders = ["Diler_Tsh", "Copart_Sniper", "Sam_Auto", "CryptoWhale", "Fixer_Pro"];

        // STATE CONTROLLERS
        let balance = parseFloat(localStorage.getItem('ops_cash')) || 150;
        let garage = JSON.parse(localStorage.getItem('ops_vault')) || [];
        let activatedPromos = JSON.parse(localStorage.getItem('ops_promo_ledger')) || [];

        let currentCar = null;
        let currentPrice = 0;
        let topBidder = "";
        let playerInvested = 0;
        let secondsLeft = 4.0;

        let clockThread = null;
        let aiThread = null;
        let isAuctionLive = true;

        function initApp() {
            syncInterface();
            startNewAuction();
        }

        function syncInterface() {
            document.getElementById('wallet-balance').innerText = Math.floor(balance);
            document.getElementById('lbl-garage-header').innerText = `${dict[currentLang].gar} (${garage.length})`;
            document.getElementById('lbl-status').innerText = dict[currentLang].cond;
            
            if (isAuctionLive) {
                document.getElementById('main-action-btn').innerText = dict[currentLang].bid;
            } else {
                document.getElementById('main-action-btn').innerText = dict[currentLang].next;
            }

            // Sync Garage Render
            const container = document.getElementById('garage-container');
            container.innerHTML = "";
            garage.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = "garage-card";
                card.innerHTML = `
                    <div>
                        <div style="font-weight:700; font-size:13px; color:#fff;">${item.name}</div>
                        <div style="color:var(--neon-green); font-size:11px; margin-top:2px;">Buy: $${item.buy} ➔ Sell: $${item.sell}</div>
                    </div>
                    <button class="btn-sell" onclick="sellCar(${index})">${dict[currentLang].sell}</button>
                `;
                container.appendChild(card);
            });

            localStorage.setItem('ops_cash', balance);
            localStorage.setItem('ops_vault', JSON.stringify(garage));
            localStorage.setItem('ops_promo_ledger', JSON.stringify(activatedPromos));
        }

        function startNewAuction() {
            clearInterval(clockThread);
            clearTimeout(aiThread);

            currentCar = carRegistry[Math.floor(Math.random() * carRegistry.length)];
            currentPrice = currentCar.base;
            topBidder = "";
            playerInvested = 0;
            secondsLeft = 4.0;
            isAuctionLive = true;

            document.getElementById('vector-viewport').innerHTML = currentCar.svg;
            document.getElementById('car-title').innerText = currentCar.name;
            document.getElementById('price-badge').innerText = "$" + currentPrice;
            document.getElementById('timer-badge').innerText = secondsLeft.toFixed(1) + "s";
            document.getElementById('timer-badge').style.background = "var(--neon-red)";
            
            document.getElementById('terminal-box').innerHTML = `<div class="feed-line" style="color:var(--neon-blue)">[LIVE]: Лот выставлен. Стартовая цена: $${currentPrice}</div>`;
            document.getElementById('main-action-btn').onclick = triggerBid;

            syncInterface();
            runClock();
            scheduleAiMove();
        }

        function runClock() {
            clockThread = setInterval(() => {
                secondsLeft -= 0.1;
                if (secondsLeft <= 0) {
                    secondsLeft = 0;
                    clearInterval(clockThread);
                    finalizeAuction();
                }
                document.getElementById('timer-badge').innerText = secondsLeft.toFixed(1) + "s";
            }, 100);
        }

        function triggerBid() {
            if (!isAuctionLive) return;

            if (balance < 10) {
                alert(dict[currentLang].noMoney);
                return;
            }

            balance -= 10;
            playerInvested += 10;
            currentPrice += 10;
            topBidder = "Player";
            secondsLeft = 4.0; // Reset

            pushLog("You", currentPrice);
            document.getElementById('price-badge').innerText = "$" + currentPrice;
            syncInterface();

            clearTimeout(aiThread);
            scheduleAiMove();
        }

        function scheduleAiMove() {
            if (!isAuctionLive) return;

            if (currentPrice < currentCar.max) {
                // O'rtacha qiyinlik darajasi (bot har doim ham darhol stavka beravermaydi, 50% imkoniyat)
                if (Math.random() > 0.45) {
                    let pace = 800 + Math.random() * 1400; 
                    aiThread = setTimeout(() => {
                        if (!isAuctionLive) return;

                        currentPrice += 10;
                        let bot = aiBidders[Math.floor(Math.random() * aiBidders.length)];
                        topBidder = bot;
                        secondsLeft = 4.0;

                        pushLog(bot, currentPrice);
                        document.getElementById('price-badge').innerText = "$" + currentPrice;

                        scheduleAiMove();
                    }, pace);
                }
            }
        }

        function pushLog(user, price) {
            const box = document.getElementById('terminal-box');
            let color = user === "You" ? "var(--neon-green)" : "var(--text-white)";
            box.innerHTML += `<div class="feed-line" style="color:${color}">➔ <b>${user}</b>: ставка <b>$${price}</b></div>`;
            box.scrollTop = box.scrollHeight;
        }

        function finalizeAuction() {
            isAuctionLive = false;
            clearTimeout(aiThread);
            document.getElementById('timer-badge').style.background = "#4b5563";

            if (topBidder === "Player") {
                alert(dict[currentLang].won);
                let profit = 25 + Math.floor(Math.random() * 16); 
                garage.push({
                    name: currentCar.name,
                    buy: currentPrice,
                    sell: currentPrice + profit
                });
            } else if (topBidder === "") {
                alert("No bids placed. Session closed.");
            } else {
                if (playerInvested > 0) {
                    balance += playerInvested; // Yutqazganda pulni 100% qaytarish
                    alert(`${topBidder} ${dict[currentLang].botWon}`);
                } else {
                    alert(`${topBidder} won the lot.`);
                }
            }

            document.getElementById('main-action-btn').innerText = dict[currentLang].next;
            document.getElementById('main-action-btn').onclick = startNewAuction;
            syncInterface();
        }

        function sellCar(index) {
            balance += garage[index].sell;
            garage.splice(index, 1);
            syncInterface();
        }

        function applyPromoCode() {
            const input = document.getElementById('promo-input').value.trim();
            if (input === "seevent2026" || input === "welecet200") {
                if (activatedPromos.includes(input)) {
                    alert(dict[currentLang].promoUsed);
                    return;
                }
                let reward = input === "seevent2026" ? 500 : 800;
                balance += reward;
                activatedPromos.push(input);
                alert(dict[currentLang].promoOk + ` (+$${reward})`);
                document.getElementById('promo-input').value = "";
                syncInterface();
            } else {
                alert(dict[currentLang].promoWrong);
            }
        }

        function switchLang() {
            currentLang = document.getElementById('lang-menu').value;
            syncInterface();
        }

        window.onload = initApp;
    </script>
</body>
</html>
