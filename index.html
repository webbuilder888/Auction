<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copart Auction Simulator 2026</title>
    <style>
        :root {
            --bg-dark: #060b13;
            --panel-bg: #111827;
            --panel-border: rgba(255, 255, 255, 0.08);
            --neon-blue: #00f0ff;
            --neon-green: #00ff66;
            --neon-red: #ff3366;
            --text-white: #ffffff;
            --text-gray: #9ca3af;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-white);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        /* HEADER */
        header {
            background: rgba(17, 24, 39, 0.8);
            backdrop-filter: blur(12px);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--panel-border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 1.5px;
            background: linear-gradient(90deg, var(--neon-blue), #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .balance-card {
            background: rgba(0, 255, 102, 0.1);
            border: 1px solid var(--neon-green);
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 20px;
            color: var(--neon-green);
        }

        select, input[type="text"] {
            background: #1f2937;
            color: white;
            border: 1px solid var(--panel-border);
            padding: 10px 15px;
            border-radius: 8px;
            outline: none;
            font-weight: 600;
        }

        /* APP LAYOUT */
        .dashboard {
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 25px;
            display: grid;
            grid-template-columns: 2.5fr 1fr;
            gap: 35px;
        }

        .panel {
            background: var(--panel-bg);
            border-radius: 20px;
            border: 1px solid var(--panel-border);
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
        }

        .panel-title {
            font-size: 22px;
            font-weight: 800;
            margin-top: 0;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-left: 4px solid var(--neon-blue);
            padding-left: 12px;
        }

        /* CAR VIEW */
        .car-stage {
            width: 100%;
            height: 400px;
            border-radius: 14px;
            overflow: hidden;
            background: #000;
            margin-bottom: 25px;
            position: relative;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .car-stage img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .car-info-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 25px;
        }

        .car-meta h2 { margin: 0; font-size: 28px; font-weight: 800; }
        .tag-wrecked {
            display: inline-block;
            background: rgba(255, 51, 102, 0.15);
            border: 1px solid var(--neon-red);
            color: var(--neon-red);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            margin-top: 8px;
            text-transform: uppercase;
        }

        .auction-status {
            text-align: right;
        }

        .timer-box {
            background: var(--neon-red);
            color: white;
            padding: 6px 18px;
            border-radius: 30px;
            font-weight: 900;
            font-size: 16px;
            display: inline-block;
            box-shadow: 0 0 15px rgba(255, 51, 102, 0.4);
        }

        .live-price {
            font-size: 36px;
            font-weight: 900;
            color: var(--neon-blue);
            margin-top: 10px;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
        }

        /* LIVE BID LOG */
        .logs-window {
            height: 140px;
            background: #0b0f17;
            border-radius: 12px;
            padding: 15px;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.03);
            margin-bottom: 25px;
            font-family: monospace;
        }

        .log-line {
            padding: 5px 0;
            border-bottom: 1px solid rgba(255,255,255,0.02);
            font-size: 14px;
        }

        /* INTERACTION BUTTONS */
        .action-grid {
            display: flex;
            gap: 20px;
        }

        .btn {
            padding: 16px 30px;
            border: none;
            border-radius: 12px;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.2s;
        }

        .btn-primary {
            background: linear-gradient(90deg, var(--neon-blue), #00a8ff);
            color: #000;
            flex: 2;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
        }

        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.4);
        }

        .btn-secondary {
            background: #242f41;
            color: white;
            flex: 1;
        }

        /* GARAGE & UTILITIES */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .garage-scroller {
            max-height: 380px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .garage-card {
            background: #1f2937;
            border-radius: 12px;
            padding: 15px;
            border: 1px solid rgba(255,255,255,0.03);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-sell {
            background: var(--neon-green);
            color: #000;
            padding: 8px 16px;
            font-size: 13px;
            border-radius: 8px;
        }

        .promo-container {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .promo-container input { flex: 1; }
        .promo-container button { flex: 0.5; padding: 10px; font-size: 13px; }
    </style>
</head>
<body>

    <header>
        <div class="brand">COPART ULTRA 2026</div>
        <div class="header-right">
            <select id="lang-select" onchange="switchLanguage()">
                <option value="ru">Русский</option>
                <option value="en">English</option>
            </select>
            <div class="balance-card">$<span id="bal-val">150</span></div>
        </div>
    </header>

    <div class="dashboard">
        <div class="panel">
            <h1 class="panel-title" id="lbl-live-lot">Прямой Эфир Аукциона</h1>
            
            <div class="car-stage">
                <img id="car-stage-img" src="" alt="Live Car Feed">
            </div>

            <div class="car-info-row">
                <div class="car-meta">
                    <h2 id="car-stage-title">Загрузка лота...</h2>
                    <div class="tag-wrecked" id="lbl-wrecked-status">Поврежден / Copart Verified</div>
                </div>
                <div class="auction-status">
                    <div id="timer-ui" class="timer-box">4.0s</div>
                    <div id="price-ui" class="live-price">$0</div>
                </div>
            </div>

            <div class="logs-window" id="logs-ui"></div>

            <div class="action-grid">
                <button class="btn btn-primary" id="btn-bid" onclick="placeBid()">Повысить ставку (+$10)</button>
                <button class="btn btn-secondary" id="btn-next" onclick="skipToNext()" style="display:none;">Следующий Лот</button>
            </div>
        </div>

        <div class="sidebar">
            <div class="panel">
                <h1 class="panel-title" id="lbl-garage">Мой Ангар / Гараж</h1>
                <div class="garage-scroller" id="garage-ui"></div>
            </div>

            <div class="panel">
                <h1 class="panel-title" id="lbl-promo">Активация Ваучеров</h1>
                <div class="promo-container">
                    <input type="text" id="promo-input" placeholder="Введите промокод...">
                    <button class="btn btn-primary" style="padding:0;" onclick="applyPromo()">OK</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ЛОКАЛИЗАЦИОННАЯ МАТРИЦА
        const dictionary = {
            ru: {
                liveLot: "Прямой Эфир Аукциона",
                wrecked: "Поврежден / Copart 2026",
                bidBtn: "Повысить ставку (+$10)",
                nextBtn: "Следующий Лот",
                garage: "Мой Гараж",
                promo: "Промокод",
                sell: "Продать лот",
                winAlert: "🎉 Поздравляем! Лот принадлежит вам. Он отправлен в ваш гараж.",
                botAlert: "забрал автомобиль. Ваши инвестиции возвращены на кошелек.",
                noFunds: "Недостаточно ликвидных средств для повышения ставки!",
                promoSuccess: "⚡ Код активирован! Баланс пополнен на +$500",
                promoFail: "Данный ваучер не существует или устарел."
            },
            en: {
                liveLot: "Live Auction Feed",
                wrecked: "Salvage / Copart 2026",
                bidBtn: "Place Bid (+$10)",
                nextBtn: "Next Lot",
                garage: "My Garage",
                promo: "Promo Code",
                sell: "Sell Vehicle",
                winAlert: "🎉 Congratulations! You won this lot. Car sent to your garage.",
                botAlert: "won the lot. Your bids have been refunded to your wallet.",
                noFunds: "Insufficient funds to place this bid!",
                promoSuccess: "⚡ Promo activated! Total balance increased by +$500",
                promoFail: "Invalid or expired promo voucher."
            }
        };

        let currentLang = 'ru';

        // БОЛЬШАЯ ОБНОВЛЕННАЯ БАЗА АВТОМОБИЛЕЙ (ОТ ДЕШЕВЫХ ДО САМЫХ ДОРОГИХ 2026 ГОДА)
        const carRegistry = [
            { name: "VAZ 2106 (1988) - Тотальное ДТП", base: 40, maxBot: 110, img: "https://upload.wikimedia.org/wikipedia/commons/e/e4/Lada_2106_in_wrecked_condition.jpg" },
            { name: "Jiguli 2101 (1979) - Ржавчина и Удар", base: 30, maxBot: 90, img: "https://upload.wikimedia.org/wikipedia/commons/7/75/Wrecked_Lada_2101.jpg" },
            { name: "Chevrolet Nexia 3 (2021) - Перевертыш", base: 80, maxBot: 210, img: "https://upload.wikimedia.org/wikipedia/commons/3/3a/Damaged_Chevrolet_Cobalt_Nexia.jpg" },
            { name: "Kia Sportage (2026) - Фронтальное столкновение", base: 350, maxBot: 950, img: "https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?auto=format&fit=crop&q=80&w=800" },
            { name: "BMW M5 F90 (2024) - Пожар в моторном отсеке", base: 600, maxBot: 1800, img: "https://images.unsplash.com/photo-1552519507-da3b142c6e3d?auto=format&fit=crop&q=80&w=800" },
            { name: "Porsche 911 GT3 (2025) - Боковой скользящий удар", base: 1200, maxBot: 3500, img: "https://images.unsplash.com/photo-1614162692292-7ac56d7f7f1e?auto=format&fit=crop&q=80&w=800" }
        ];

        const virtualBidders = ["CryptoWhale", "Copart_Pro_Uz", "Tashkent_Diler", "Dubai_Export", "SalvageKing"];

        // СОСТОЯНИЕ ПРИЛОЖЕНИЯ
        let balance = parseFloat(localStorage.getItem('c_bal')) || 150;
        let garage = JSON.parse(localStorage.getItem('c_gar')) || [];
        
        let activeCar = null;
        let activePrice = 0;
        let topBidder = "";
        let playerInvested = 0;
        let timeLeft = 4.0;
        
        let mainTimer = null;
        let aiBrain = null;
        let isLive = true;

        function startSystem() {
            renderUI();
            nextAuctionCycle();
        }

        function renderUI() {
            document.getElementById('bal-val').innerText = Math.floor(balance);
            
            // Локализация текстов интерфейса
            document.getElementById('lbl-live-lot').innerText = dictionary[currentLang].liveLot;
            document.getElementById('lbl-wrecked-status').innerText = dictionary[currentLang].wrecked;
            document.getElementById('btn-bid').innerText = dictionary[currentLang].bidBtn;
            document.getElementById('btn-next').innerText = dictionary[currentLang].nextBtn;
            document.getElementById('lbl-garage').innerText = dictionary[currentLang].garage;
            document.getElementById('lbl-promo').innerText = dictionary[currentLang].promo;

            // Рендер Гаража
            const gBox = document.getElementById('garage-ui');
            gBox.innerHTML = "";
            garage.forEach((car, i) => {
                const el = document.createElement('div');
                el.className = "garage-card";
                el.innerHTML = `
                    <div>
                        <div style="font-weight:700; font-size:14px;">${car.name}</div>
                        <div style="color:var(--neon-green); font-size:12px; margin-top:4px;">Buy: $${car.buy} ➔ Est. Sell: $${car.sell}</div>
                    </div>
                    <button class="btn btn-sell" onclick="liquidateCar(${i})">${dictionary[currentLang].sell}</button>
                `;
                gBox.appendChild(el);
            });

            // Сохранение сессии
            localStorage.setItem('c_bal', balance);
            localStorage.setItem('c_gar', JSON.stringify(garage));
        }

        function nextAuctionCycle() {
            clearInterval(mainTimer);
            clearTimeout(aiBrain);

            activeCar = carRegistry[Math.floor(Math.random() * carRegistry.length)];
            activePrice = activeCar.base;
            topBidder = "";
            playerInvested = 0;
            timeLeft = 4.0;
            isLive = true;

            document.getElementById('car-stage-img').src = activeCar.img;
            document.getElementById('car-stage-title').innerText = activeCar.name;
            document.getElementById('price-ui').innerText = "$" + activePrice;
            document.getElementById('timer-ui').innerText = timeLeft.toFixed(1) + "s";
            document.getElementById('timer-ui').style.background = "var(--neon-red)";
            
            document.getElementById('logs-ui').innerHTML = `<div class="log-line" style="color:var(--neon-blue)">[SYSTEM]: На торги выставлен новый лот. Стартовая цена: $${activePrice}</div>`;
            
            document.getElementById('btn-bid').style.display = "block";
            document.getElementById('btn-next').style.display = "none";

            runClock();
            scheduleAiMove();
        }

        function runClock() {
            mainTimer = setInterval(() => {
                timeLeft -= 0.1;
                if (timeLeft <= 0) {
                    timeLeft = 0;
                    clearInterval(mainTimer);
                    evaluateWinner();
                }
                document.getElementById('timer-ui').innerText = timeLeft.toFixed(1) + "s";
            }, 1000);
        }

        function placeBid() {
            if (!isLive) return;

            if (balance < 10) {
                alert(dictionary[currentLang].noFunds);
                return;
            }

            balance -= 10;
            playerInvested += 10;
            activePrice += 10;
            topBidder = "Player";
            timeLeft = 4.0; // Сброс таймера назад на 4 секунды

            addLog("You", activePrice);
            document.getElementById('price-ui').innerText = "$" + activePrice;
            renderUI();

            clearTimeout(aiBrain);
            scheduleAiMove();
        }

        function scheduleAiMove() {
            if (!isLive) return;

            if (activePrice < activeCar.maxBot) {
                let thinkingTime = 800 + Math.random() * 1800; // Боты реагируют в пределах 0.8 - 2.6 сек.
                aiBrain = setTimeout(() => {
                    if (!isLive) return;

                    activePrice += 10;
                    let botName = virtualBidders[Math.floor(Math.random() * virtualBidders.length)];
                    topBidder = botName;
                    timeLeft = 4.0; // Сброс таймера ботом

                    addLog(botName, activePrice);
                    document.getElementById('price-ui').innerText = "$" + activePrice;
                    
                    scheduleAiMove();
                }, thinkingTime);
            }
        }

        function addLog(user, price) {
            const container = document.getElementById('logs-ui');
            let color = user === "You" ? "var(--neon-green)" : "var(--text-white)";
            container.innerHTML += `<div class="log-line" style="color:${color}">➔ <b>${user}</b> предложил ставку: <b>$${price}</b></div>`;
            container.scrollTop = container.scrollHeight;
        }

        function evaluateWinner() {
            isLive = false;
            clearTimeout(aiBrain);
            document.getElementById('timer-ui').style.background = "#374151";

            if (topBidder === "Player") {
                alert(dictionary[currentLang].winAlert);
                // Наценка при перепродаже составляет от 25 до 40 долларов
                let bonusProfit = 25 + Math.floor(Math.random() * 16); 
                garage.push({
                    name: activeCar.name,
                    buy: activePrice,
                    sell: activePrice + bonusProfit
                });
            } else if (topBidder === "") {
                alert("Lot expired. No bids placed.");
            } else {
                // Если выиграл бот, возвращаем все деньги, которые игрок успел поставить на данный лот
                if (playerInvested > 0) {
                    balance += playerInvested;
                    alert(`${topBidder} ${dictionary[currentLang].botAlert}`);
                } else {
                    alert(`${topBidder} won the lot.`);
                }
            }

            document.getElementById('btn-bid').style.display = "none";
            document.getElementById('btn-next').style.display = "block";
            renderUI();
        }

        function liquidateCar(index) {
            balance += garage[index].sell;
            garage.splice(index, 1);
            renderUI();
        }

        function skipToNext() {
            nextAuctionCycle();
        }

        function applyPromo() {
            const input = document.getElementById('promo-input').value.trim();
            if (input === "seevent2026") {
                balance += 500;
                alert(dictionary[currentLang].promoSuccess);
                document.getElementById('promo-input').value = "";
                renderUI();
            } else {
                alert(dictionary[currentLang].promoFail);
            }
        }

        function switchLanguage() {
            currentLang = document.getElementById('lang-select').value;
            renderUI();
            if (!isLive) {
                document.getElementById('btn-next').innerText = dictionary[currentLang].nextBtn;
            }
        }

        window.onload = startSystem;
    </script>
</body>
</html>
