<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEXUS AUCTION — Maintenance</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #050814 0%, #0c102b 100%);
            --neon-blue: #00f0ff;
            --neon-purple: #a855f7;
            --neon-red: #ff3366;
            --text-white: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg-gradient);
            color: var(--text-white);
            font-family: 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        /* CENTER CONTAINER WITH NEON SHADOW */
        .maintenance-box {
            background: rgba(16, 22, 47, 0.85);
            border: 2px solid var(--neon-purple);
            box-shadow: 0 0 35px rgba(168, 85, 247, 0.4), inset 0 0 15px rgba(0, 240, 255, 0.1);
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            max-width: 450px;
            width: 90%;
            box-sizing: border-box;
            backdrop-filter: blur(12px);
            animation: pulseGlow 3s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 25px rgba(168, 85, 247, 0.3); }
            100% { box-shadow: 0 0 45px rgba(0, 240, 255, 0.5); }
        }

        .logo {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .status-badge {
            display: inline-block;
            background: rgba(255, 51, 102, 0.15);
            border: 1px solid var(--neon-red);
            color: var(--neon-red);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 25px;
            box-shadow: 0 0 10px rgba(255, 51, 102, 0.2);
        }

        .message {
            font-size: 15px;
            line-height: 1.6;
            color: #9cb0d8;
            margin-bottom: 30px;
        }

        /* COUNTDOWN DIGITAL COUNTER */
        .timer-grid {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .timer-card {
            background: rgba(10, 15, 36, 0.8);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 10px;
            padding: 12px 18px;
            min-width: 70px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        .timer-num {
            font-size: 32px;
            font-weight: 900;
            color: var(--neon-blue);
            font-family: monospace;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
        }

        .timer-lbl {
            font-size: 10px;
            text-transform: uppercase;
            color: #627293;
            margin-top: 4px;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="maintenance-box">
        <div class="logo">NEXUS AUCTION</div>
        <div class="status-badge">SYSTEM UPDATE</div>
        
        <div class="message">
            Игра временно приостановлена разработчиками для внедрения масштабного обновления. <br>
            <b>Ориентировочное время запуска: через 2 часа 30 минут.</b>
        </div>

        <div class="timer-grid">
            <div class="timer-card">
                <div class="timer-num" id="hr">02</div>
                <div class="timer-lbl">Часы</div>
            </div>
            <div class="timer-card">
                <div class="timer-num" id="mn">30</div>
                <div class="timer-lbl">Мин</div>
            </div>
            <div class="timer-card">
                <div class="timer-num" id="sc">00</div>
                <div class="timer-lbl">Сек</div>
            </div>
        </div>
    </div>

    <script>
        // VAQTIY REAL VAQTLARNI SAQLASH (SAYTDAN CHIQIB KETSA HAM TO'XTAMAYDI)
        const durationInMs = (2 * 60 * 60 * 1000) + (30 * 60 * 1000); // 2 soat 30 daqiqa millisekundlarda
        let targetTime = localStorage.getItem('nexus_maintenance_target');

        if (!targetTime) {
            // Agar taymer birinchi marta o'rnatilayotgan bo'lsa, hozirgi vaqtga 2.5 soat qo'shamiz
            targetTime = Date.now() + durationInMs;
            localStorage.setItem('nexus_maintenance_target', targetTime);
        } else {
            targetTime = parseInt(targetTime);
        }

        function updateCountdown() {
            const currentTime = Date.now();
            const difference = targetTime - currentTime;

            if (difference <= 0) {
                // Vaqt tugaganda blokirovka olib tashlanadi va yangi o'yinga ruxsat beriladi
                localStorage.removeItem('nexus_maintenance_target');
                document.querySelector('.maintenance-box').innerHTML = `
                    <div class="logo">NEXUS AUCTION</div>
                    <div class="status-badge" style="border-color:var(--neon-green); color:var(--neon-green); background:rgba(0,255,102,0.1)">ONLINE</div>
                    <div class="message">Обновление успешно завершено! Перезагрузите страницу для входа в игру.</div>
                `;
                return;
            }

            // Matematik hisob-kitoblar (Soat, Daqiqa, Soniya)
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            // Ekranga chiqarish (Agar 1 xonali bo'lsa oldiga 0 qo'shadi)
            document.getElementById('hr').innerText = hours < 10 ? "0" + hours : hours;
            document.getElementById('mn').innerText = minutes < 10 ? "0" + minutes : minutes;
            document.getElementById('sc').innerText = seconds < 10 ? "0" + seconds : seconds;
        }

        // Har soniyada vaqtni yangilab turish
        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
