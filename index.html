<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEXUS AUCTION — Compact Mobile Edition</title>
    <style>
        :root {
            --bg-dark: #020308;
            --panel-glass: rgba(6, 10, 26, 0.85);
            --panel-border: rgba(0, 240, 255, 0.3);
            --neon-blue: #00f0ff;
            --neon-green: #00ff66;
            --neon-red: #ff3366;
            --neon-purple: #bd59ff;
            --neon-diamond: #00e5ff;
            --text-white: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg-dark);
            color: var(--text-white);
            font-family: 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden; /* Skroll butkul o'chirildi */
            display: flex;
            flex-direction: column;
            position: relative;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        /* LIVE BACKGROUND GRID */
        .cyber-grid {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(0, 240, 255, 0.02) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0, 240, 255, 0.02) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: 1;
            animation: gridMove 15s infinite linear;
        }
        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 0 30px; }
        }

        .bg-glows {
            position: absolute;
            width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 20%, rgba(189, 89, 255, 0.1) 0%, transparent 50%);
            z-index: 1;
            pointer-events: none;
        }

        /* FIXED ONE-SCREEN TOP HEADER */
        .nexus-header {
            background: rgba(3, 5, 14, 0.95);
            border-bottom: 2px solid var(--neon-blue);
            padding: 0 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 60px;
            z-index: 10;
            box-shadow: 0 4px 20px rgba(0, 240, 255, 0.15);
        }

        .brand-title {
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 1.5px;
            text-shadow: 0 0 8px var(--neon-blue);
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .asset-badge-cash {
            background: rgba(0, 255, 102, 0.1);
            border: 1.5px solid var(--neon-green);
            padding: 4px 8px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 13px;
            color: var(--neon-green);
        }

        .asset-badge-diamond {
            background: rgba(0, 229, 255, 0.1);
            border: 1.5px solid var(--neon-diamond);
            padding: 4px 8px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 13px;
            color: var(--neon-diamond);
        }

        .btn-menu-promo {
            background: var(--neon-purple);
            color: white;
            border: none;
            padding: 5px 10px;
            font-weight: 900;
            font-size: 12px;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 10px var(--neon-purple);
        }

        /* APP MAIN WORKSPACE — FULLY FITS ONE SCREEN */
        .nexus-workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 10px;
            gap: 10px;
            box-sizing: border-box;
            z-index: 5;
            height: calc(100vh - 60px);
            justify-content: space-between;
        }

        /* MAIN CENTERED PANEL */
        .center-showcase {
            flex: 1;
            background: var(--panel-glass);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 12px;
            box-sizing: border-box;
            overflow: hidden;
        }

        .mode-indicator {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #000;
            border: 1px solid var(--neon-blue);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
        }

        /* CANVAS ENGINE HOLDER */
        .car-viewport-stage {
            width: 100%;
            height: 45%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            display: block;
            max-width: 100%;
            max-height: 100%;
        }

        /* COMPACT HUD PANEL */
        .hud-metrics-panel {
            display: grid;
            grid-template-columns: 1.2fr 1fr 0.8fr;
            align-items: center;
            background: rgba(2, 4, 12, 0.9);
            padding: 10px;
            border-radius: 12px;
            gap: 5px;
            border: 1px solid rgba(255,255,255,0.03);
        }

        .car-info h2 { margin: 0; font-size: 15px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .tier-tag {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 9px;
            font-weight: 800;
            text-transform: uppercase;
            margin-top: 2px;
        }

        .live-price-zone { text-align: center; }
        .live-price-tag { font-size: 20px; font-weight: 900; font-family: monospace; }

        .time-zone { text-align: right; }
        .countdown-display { 
            background: var(--neon-red); 
            color: white; 
            padding: 4px 8px; 
            border-radius: 8px; 
            font-weight: 900; 
            font-size: 12px;
        }

        /* TERMINAL FEEDS */
        .terminal-log-box {
            height: 50px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            padding: 6px 10px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 11px;
        }
        .feed-item { padding: 1px 0; }

        /* THE ACTION BUTTON */
        .btn-nexus-core-bid {
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple));
            color: white;
            border: none;
            padding: 14px;
            font-size: 15px;
            font-weight: 900;
            border-radius: 12px;
            cursor: pointer;
            text-transform: uppercase;
            width: 100%;
            box-shadow: 0 4px 15px rgba(189, 89, 255, 0.3);
            letter-spacing: 1px;
        }

        /* COMPACT HORIZONTAL TRAY (GARAJ) */
        .bottom-garage-tray {
            background: var(--panel-glass);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            height: 105px;
            box-sizing: border-box;
        }

        .garage-header-title {
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            color: var(--neon-purple);
        }

        .garage-vault-horizontal-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            white-space: nowrap;
            flex: 1;
        }
        .garage-vault-horizontal-scroll::-webkit-scrollbar { height: 0px; }

        .garage-item-card {
            display: inline-flex;
            flex-direction: column;
            justify-content: space-between;
            background: rgba(14, 21, 46, 0.95);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 8px 10px;
            border-radius: 10px;
            min-width: 160px;
            box-sizing: border-box;
        }

        .btn-sell-asset {
            background: var(--neon-green);
            color: #000;
            border: none;
            padding: 3px;
            font-weight: 900;
            font-size: 10px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }

        /* NEW DIALOG POPUP MENU (PROMO SENSATSION OKNMASI) */
        .promo-modal-overlay {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.85);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }
        .promo-modal-card {
            background: #090e24;
            border: 2px solid var(--neon-purple);
            border-radius: 16px;
            padding: 20px;
            width: 280px;
            text-align: center;
            box-shadow: 0 0 25px var(--neon-purple);
        }
        .promo-modal-card h3 { margin: 0 0 15px 0; font-size: 16px; text-transform: uppercase; color: var(--neon-purple); letter-spacing: 1px;}
        .promo-modal-card input {
            width: 100%;
            background: #02040a;
            color: #fff;
            border: 1px solid var(--panel-border);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            box-sizing: border-box;
            outline: none;
            text-align: center;
            font-weight: bold;
        }
        .modal-btn-group { display: flex; gap: 8px; }
        .modal-btn-group button {
            flex: 1; padding: 10px; font-weight: 900; font-size: 13px; border-radius: 8px; border: none; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="cyber-grid"></div>
    <div class="bg-glows"></div>

    <div class="nexus-header">
        <div class="brand-title">NEXUS M-EDITION</div>
        
        <div class="header-controls">
            <button class="btn-menu-promo" onclick="togglePromoMenu(true)">🎁 PROMO</button>
            <div class="asset-badge-diamond">💎 <span id="txt-diamonds">0</span></div>
            <div class="asset-badge-cash">💵 $<span id="txt-bankroll">150</span></div>
        </div>
    </div>

    <div class="nexus-workspace">
        
        <div class="center-showcase">
            <div class="mode-indicator" id="lbl-mode-state">Standart Mode</div>
            
            <div class="car-viewport-stage">
                <canvas id="carCanvas" width="450" height="200"></canvas>
            </div>

            <div class="hud-metrics-panel">
                <div class="car-info">
                    <h2 id="txt-car-name">Loading Asset...</h2>
                    <div class="tier-tag" id="lbl-tier-tag">Standart</div>
                </div>
                <div class="live-price-zone">
                    <div id="txt-price" class="live-price-tag" style="color: var(--neon-green);">$0</div>
                </div>
                <div class="time-zone">
                    <span id="txt-timer" class="countdown-display">4.0s</span>
                </div>
            </div>

            <div class="terminal-log-box" id="terminal-feed-logs"></div>

            <button class="btn-nexus-core-bid" id="btn-master-action" onclick="submitBidAction()">Повысить ставку (+$10)</button>
        </div>

        <div class="bottom-garage-tray">
            <div class="garage-header-title" id="lbl-garage-heading">Гараж (0)</div>
            <div class="garage-vault-horizontal-scroll" id="garage-vault-container"></div>
        </div>

    </div>

    <div class="promo-modal-overlay" id="promoMenuOverlay">
        <div class="promo-modal-card">
            <h3>АКТИВАЦИЯ ПРОМОКОДА</h3>
            <input type="text" id="promo-field-node" placeholder="ВВЕДИТЕ КОД...">
            <div class="modal-btn-group">
                <button style="background:#374151; color:white;" onclick="togglePromoMenu(false)">ЗАКРЫТЬ</button>
                <button style="background:var(--neon-purple); color:white;" onclick="claimPromoToken()">ОК</button>
            </div>
        </div>
    </div>

    <script>
        const premiumRegistry = [
            { name: "Pagani Utopia Roadster (2026)", base: 34000, max: 95000, margin: 1000, color: "#cbd5e1", type: "sport" },
            { name: "Ferrari SF90 Stradale (2024)", base: 120000, max: 390000, margin: 1500, color: "#ff2a2a", type: "sport" },
            { name: "Lamborghini Revuelto (2025)", base: 250000, max: 620000, margin: 2000, color: "#ff9f00", type: "sport" },
            { name: "McLaren P1 Carbon Edition", base: 450000, max: 980000, margin: 2500, color: "#0070f3", type: "sport" },
            { name: "Porsche 918 Spyder Hybrid", base: 600000, max: 1300000, margin: 3000, color: "#10b981", type: "sport" },
            { name: "Koenigsegg Jesko Absolut", base: 950000, max: 2400000, margin: 4000, color: "#6366f1", type: "sport" },
            { name: "Bugatti Chiron Super Sport", base: 1500000, max: 3800000, margin: 4500, color: "#ff007f", type: "sport" },
            { name: "Bugatti Tourbillon V16 (2026)", base: 2100000, max: 4600000, margin: 5000, color: "#00f0ff", type: "sport" },
            { name: "Pagani Huayra Codalunga", base: 2800000, max: 5100000, margin: 5000, color: "#14b8a6", type: "sport" },
            { name: "Lamborghini Veneno Roadster", base: 3200000, max: 5400000, margin: 5000, color: "#f43f5e", type: "sport" },
            { name: "Bugatti La Voiture Noire", base: 4000000, max: 5800000, margin: 5000, color: "#1e293b", type: "sport" },
            { name: "Rolls-Royce Droptail Amethyst", base: 4500000, max: 6000000, margin: 5000, color: "#a855f7", type: "sedan" }
        ];

        const standartRegistry = [
            { name: "Chevrolet Spark (2012)", base: 65, max: 155, margin: 30, color: "#06b6d4", type: "sedan" },
            { name: "Chevrolet Cobalt (2021)", base: 95, max: 220, margin: 45, color: "#4f46e5", type: "sedan" },
            { name: "Hyundai Elantra (2023)", base: 145, max: 310, margin: 60, color: "#ec4899", type: "sedan" },
            { name: "Kia Optima K5 (2022)", base: 185, max: 395, margin: 80, color: "#f43f5e", type: "sedan" },
            { name: "Toyota Camry V70 (2021)", base: 230, max: 460, margin: 110, color: "#0f766e", type: "sedan" },
            { name: "BYD Song Plus EV (2024)", base: 290, max: 590, margin: 150, color: "#10b981", type: "suv" },
            { name: "Kia Sportage Turbo (2025)", base: 450, max: 1150, margin: 250, color: "#f59e0b", type: "suv" },
            { name: "Kia Sportage GT-Line (2026)", base: 520, max: 1390, margin: 300, color: "#ef4444", type: "suv" }
        ];

        const virtualOpponents = ["Alpha_Broker", "Cyber_Whale", "Dubai_Diler", "Crypto_King", "Nexus_Sniper"];

        let cashBalance = parseFloat(localStorage.getItem('nx_cash_v2')) || 150;
        let diamondBalance = parseInt(localStorage.getItem('nx_diamonds_v2')) || 0;
        let uniqueClaimedPromos = JSON.parse(localStorage.getItem('nx_promos_v2')) || [];
        let userVault = JSON.parse(localStorage.getItem('nx_vault_v2')) || [];

        let currentAsset = null;
        let realTimePrice = 0;
        let auctionLeader = "";
        let playerBidInvested = 0;
        let dynamicTimer = 4.0;

        let threadClock = null;
        let threadAi = null;
        let isAuctionSessionLive = true;
        let isPremiumUnlockedMode = false;

        function initNexusSystem() {
            evaluatePremiumState();
            syncVisualInterface();
            launchNewAuctionSession();
        }

        function togglePromoMenu(show) {
            document.getElementById('promoMenuOverlay').style.display = show ? 'flex' : 'none';
            if(show) document.getElementById('promo-field-node').value = "";
        }

        function evaluatePremiumState() {
            isPremiumUnlockedMode = (diamondBalance >= 200);
        }

        function drawVectorCar(color, type) {
            const canvas = document.getElementById('carCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.shadowBlur = 15; ctx.shadowColor = color; ctx.strokeStyle = color; ctx.lineWidth = 2.5;
            ctx.beginPath(); ctx.ellipse(230, 145, 150, 14, 0, 0, Math.PI * 2); ctx.stroke();

            ctx.shadowBlur = 25; ctx.fillStyle = color; ctx.fillRect(120, 137, 200, 6);

            ctx.shadowBlur = 15; ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2.5;
            ctx.beginPath();
            if (type === "sport") {
                ctx.moveTo(80, 125); ctx.lineTo(110, 98); ctx.lineTo(180, 82); ctx.lineTo(265, 82); 
                ctx.lineTo(320, 102); ctx.lineTo(370, 115); ctx.lineTo(380, 125); ctx.lineTo(370, 135); ctx.lineTo(75, 135);
                ctx.moveTo(78, 120); ctx.lineTo(70, 102); ctx.lineTo(92, 102);
            } else if (type === "suv") {
                ctx.moveTo(75, 132); ctx.lineTo(78, 88); ctx.lineTo(140, 72); ctx.lineTo(260, 72); 
                ctx.lineTo(310, 96); ctx.lineTo(370, 102); ctx.lineTo(375, 132); ctx.lineTo(75, 132);
            } else {
                ctx.moveTo(75, 128); ctx.lineTo(98, 98); ctx.lineTo(155, 82); ctx.lineTo(275, 82); 
                ctx.lineTo(320, 106); ctx.lineTo(370, 112); ctx.lineTo(370, 128); ctx.lineTo(75, 128);
            }
            ctx.closePath(); ctx.fill(); ctx.stroke();

            ctx.shadowBlur = 0; ctx.fillStyle = "#030614"; ctx.strokeStyle = color; ctx.lineWidth = 1;
            ctx.beginPath();
            if (type === "sport") { ctx.moveTo(155, 88); ctx.lineTo(235, 88); ctx.lineTo(265, 104); ctx.lineTo(135, 104); }
            else if (type === "suv") { ctx.moveTo(135, 78); ctx.lineTo(255, 78); ctx.lineTo(280, 100); ctx.lineTo(120, 100); }
            else { ctx.moveTo(145, 88); ctx.lineTo(260, 88); ctx.lineTo(285, 106); ctx.lineTo(130, 106); }
            ctx.closePath(); ctx.fill(); ctx.stroke();

            ctx.shadowBlur = 8; ctx.shadowColor = "#ffffff"; ctx.fillStyle = "#040713"; ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.arc(145, 132, 22, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.arc(305, 132, 22, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            
            ctx.shadowBlur = 15; ctx.shadowColor = varColor('--neon-blue'); ctx.strokeStyle = varColor('--neon-blue'); ctx.lineWidth = 3.5;
            ctx.beginPath();
            if (type === "sport") { ctx.moveTo(355, 115); ctx.lineTo(371, 119); }
            else { ctx.moveTo(350, 110); ctx.lineTo(366, 114); }
            ctx.stroke();
        }

        function varColor(name) {
            return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
        }

        function syncVisualInterface() {
            document.getElementById('txt-bankroll').innerText = Math.floor(cashBalance).toLocaleString();
            document.getElementById('txt-diamonds').innerText = diamondBalance.toLocaleString();
            document.getElementById('lbl-garage-heading').innerText = `Гараж (${userVault.length})`;

            const modeLbl = document.getElementById('lbl-mode-state');
            const tierTag = document.getElementById('lbl-tier-tag');
            
            if (isPremiumUnlockedMode) {
                modeLbl.innerText = "⭐ Premium Active";
                modeLbl.style.color = "var(--neon-purple)";
                modeLbl.style.borderColor = "var(--neon-purple)";
                tierTag.innerText = "Hypercar / S";
                tierTag.style.color = "var(--neon-purple)";
                tierTag.style.background = "rgba(189, 89, 255, 0.2)";
            } else {
                modeLbl.innerText = "⛓️ Standart Mode";
                modeLbl.style.color = "var(--neon-blue)";
                modeLbl.style.borderColor = "var(--neon-blue)";
                tierTag.innerText = "Standart";
                tierTag.style.color = "var(--neon-blue)";
                tierTag.style.background = "rgba(0, 240, 255, 0.1)";
            }

            if (isAuctionSessionLive) {
                document.getElementById('btn-master-action').innerText = isPremiumUnlockedMode ? "Повысить ставку (+$1000)" : "Повысить ставку (+$10)";
            } else {
                document.getElementById('btn-master-action').innerText = "Следующий Лот ➔";
            }

            const container = document.getElementById('garage-vault-container');
            container.innerHTML = "";
            userVault.forEach((item, index) => {
                const node = document.createElement('div');
                node.className = "garage-item-card";
                node.innerHTML = `
                    <div>
                        <div style="font-weight:900; font-size:12px; color:#fff; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${item.name}</div>
                        <div style="color:var(--neon-green); font-size:10px; margin-top:1px;">Продажа: +$${item.sell.toLocaleString()}</div>
                    </div>
                    <button class="btn-sell-asset" onclick="liquidateAsset(${index})">Продать</button>
                `;
                container.appendChild(node);
            });

            localStorage.setItem('nx_cash_v2', cashBalance);
            localStorage.setItem('nx_diamonds_v2', diamondBalance);
            localStorage.setItem('nx_promos_v2', JSON.stringify(uniqueClaimedPromos));
            localStorage.setItem('nx_vault_v2', JSON.stringify(userVault));
        }

        function launchNewAuctionSession() {
            clearInterval(threadClock);
            clearTimeout(threadAi);
            evaluatePremiumState();

            const activeRegistry = isPremiumUnlockedMode ? premiumRegistry : standartRegistry;
            currentAsset = activeRegistry[Math.floor(Math.random() * activeRegistry.length)];
            
            realTimePrice = currentAsset.base;
            auctionLeader = "";
            playerBidInvested = 0;
            dynamicTimer = 4.0;
            isAuctionSessionLive = true;

            drawVectorCar(currentAsset.color, currentAsset.type);

            document.getElementById('txt-car-name').innerText = currentAsset.name;
            document.getElementById('txt-price').innerText = "$" + realTimePrice.toLocaleString();
            document.getElementById('txt-timer').innerText = dynamicTimer.toFixed(1) + "s";
            
            document.getElementById('terminal-feed-logs').innerHTML = `<div class="feed-item" style="color:var(--neon-blue)">[SYSTEM]: Старт торгов лота $${realTimePrice.toLocaleString()}</div>`;
            document.getElementById('btn-master-action').onclick = submitBidAction;

            syncVisualInterface();
            startTimerCountdown();
            scheduleVirtualAiResponse();
        }

        function startTimerCountdown() {
            threadClock = setInterval(() => {
                dynamicTimer -= 0.1;
                if (dynamicTimer <= 0) {
                    dynamicTimer = 0;
                    clearInterval(threadClock);
                    finalizeAuctionSession();
                }
                document.getElementById('txt-timer').innerText = dynamicTimer.toFixed(1) + "s";
            }, 100);
        }

        function submitBidAction() {
            if (!isAuctionSessionLive) return;
            let bidStep = isPremiumUnlockedMode ? 1000 : 10;

            if (cashBalance < bidStep) {
                alert("Недостаточно средств!");
                return;
            }

            cashBalance -= bidStep;
            playerBidInvested += bidStep;
            realTimePrice += bidStep;
            auctionLeader = "Player";
            dynamicTimer = 4.0;

            pushTerminalLog("You", realTimePrice);
            document.getElementById('txt-price').innerText = "$" + realTimePrice.toLocaleString();
            syncVisualInterface();

            clearTimeout(threadAi);
            scheduleVirtualAiResponse();
        }

        function scheduleVirtualAiResponse() {
            if (!isAuctionSessionLive) return;

            if (realTimePrice < currentAsset.max) {
                if (Math.random() > 0.4) {
                    let adaptiveSpeed = isPremiumUnlockedMode ? (400 + Math.random() * 800) : (700 + Math.random() * 1200);
                    threadAi = setTimeout(() => {
                        if (!isAuctionSessionLive) return;

                        let bidStep = isPremiumUnlockedMode ? 1000 : 10;
                        realTimePrice += bidStep;
                        
                        let bot = virtualOpponents[Math.floor(Math.random() * virtualOpponents.length)];
                        auctionLeader = bot;
                        dynamicTimer = 4.0;

                        pushTerminalLog(bot, realTimePrice);
                        document.getElementById('txt-price').innerText = "$" + realTimePrice.toLocaleString();

                        scheduleVirtualAiResponse();
                    }, adaptiveSpeed);
                }
            }
        }

        function pushTerminalLog(user, price) {
            const container = document.getElementById('terminal-feed-logs');
            let color = user === "You" ? "var(--neon-green)" : "#fff";
            container.innerHTML += `<div class="feed-item" style="color:${color}">➔ <b>${user}</b>: $${price.toLocaleString()}</div>`;
            container.scrollTop = container.scrollHeight;
        }

        function finalizeAuctionSession() {
            isAuctionSessionLive = false;
            clearTimeout(threadAi);

            if (auctionLeader === "Player") {
                alert("🎉 Победитель! Машина отправлена в Гараж.");
                userVault.push({
                    name: currentAsset.name,
                    buy: realTimePrice,
                    sell: realTimePrice + currentAsset.margin
                });
            } else if (auctionLeader === "") {
                alert("Торги закрыты.");
            } else {
                if (playerBidInvested > 0) {
                    cashBalance += playerBidInvested;
                    alert(`${auctionLeader} выиграл. Ставки возвращены.`);
                } else {
                    alert(`${auctionLeader} забрал лот.`);
                }
            }

            document.getElementById('btn-master-action').innerText = "Следующий Лот ➔";
            document.getElementById('btn-master-action').onclick = launchNewAuctionSession;
            syncVisualInterface();
        }

        function liquidateAsset(index) {
            cashBalance += userVault[index].sell;
            userVault.splice(index, 1);
            syncVisualInterface();
        }

        function claimPromoToken() {
            const inputField = document.getElementById('promo-field-node').value.trim();
            
            if (uniqueClaimedPromos.includes(inputField)) {
                alert("Этот промокод уже был активирован на аккаунте!");
                return;
            }

            if (inputField === "kievka") {
                cashBalance += 999999;
                diamondBalance += 999999;
                uniqueClaimedPromos.push(inputField);
                alert("👑 Секретный код создателя! +$999,999 и +999,999 💎");
                togglePromoMenu(false);
                evaluatePremiumState();
                syncVisualInterface();
            }
            else if (inputField === "newupdatev06") {
                diamondBalance += 40;
                uniqueClaimedPromos.push(inputField);
                alert("💎 Успешно! Получено: 40 Бриллиантов.");
                togglePromoMenu(false);
                evaluatePremiumState();
                syncVisualInterface();
            }
            else if (inputField === "oclock8") {
                diamondBalance += 30;
                cashBalance += 250;
                uniqueClaimedPromos.push(inputField);
                alert("🎁 Успешно! Получено: 30 💎 и +$250.");
                togglePromoMenu(false);
                evaluatePremiumState();
                syncVisualInterface();
            }
            else if (inputField === "brilliantv03") {
                diamondBalance += 20;
                uniqueClaimedPromos.push(inputField);
                alert("💎 Получено: 20 Бриллиантов.");
                togglePromoMenu(false);
                evaluatePremiumState();
                syncVisualInterface();
            } else if (inputField === "seevent2026" || inputField === "welecet200") {
                let bonus = inputField === "seevent2026" ? 500 : 800;
                cashBalance += bonus;
                uniqueClaimedPromos.push(inputField);
                alert(`💵 Начислено: +$${bonus}`);
                togglePromoMenu(false);
                syncVisualInterface();
            } else {
                alert("Неверный промокод.");
            }
        }

        window.onload = initNexusSystem;
    </script>
</body>
</html>
